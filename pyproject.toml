[tool.poetry]
name = "abm-control"
version = "0.1.0"
description = "Image-based latent dynamics and control for stochastic biological systems"
authors = ["Jacob Evarts <31416036+jacob-evarts@users.noreply.github.com>"]
readme = "README.md"
packages = [
    { include = "koopman_control", from = "src" },
    { include = "jepa_control", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
numpy = "^2.5.1"
torch = "^2.9.1"
pytorch-lightning = "^2.6.0"
matplotlib = "^3.10.8"
h5py = "^3.15.1"
tqdm = "^4.67.3"
optuna = "^4.9.0"
scipy = "^1.18.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
tox = "^4.34.1"
black = "^26.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
