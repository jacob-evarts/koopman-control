dataset_name: gnn_wolf_sheep
format: gnn_h5
data_dir: ./data/networks/gnn_dataset_64
dataset_file: dataset.h5
manifest_file: manifest.json
batch_size: 8
num_workers: 0
preload: true
# Collate once at startup; reuse Batch tensors each epoch (helps MPS allocator churn).
precollate: true
# Stage batches on device when using MPS: batch_device: mps
# CPU training (recommended for GNN): trainer=cpu or trainer.accelerator=cpu
# Fixed latent size + GNN hyperparam search: optim=gnn
